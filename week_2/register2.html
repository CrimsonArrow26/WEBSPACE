<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="register2.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Rethink+Sans:ital,wght@0,400..800;1,400..800&family=Satisfy&family=Secular+One&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/week_2/favicon.ico" />
    <link rel="stylesheet" href="darkmode.css" />
    <script src="darkmode.js" defer></script>
    <title>Register with Email</title>
  </head>
  <body>
    <script type="module" src="redirect-if-auth.js"></script>
    <div id="auth-loader" style="position:fixed;z-index:9999;top:0;left:0;width:100vw;height:100vh;background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:1.5rem;">Checking authentication...</div>
    <div class="container">
      <img class="background-image" src="resources/elements/Frame.png" />
      <img class="background-image1" src="resources/elements/Frame.png" />
      <div class="overlay"></div>

      <form id="signup-form" class="signup-form">
        <label for="email">E-mail address</label>
        <input type="email" id="email" placeholder="Enter your email" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />

        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Confirm your password" required />

        <div class="password-strength">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
        <p id="strength-text" class="note"></p>
      </form>
      
      <div class="content">
        <div class="buttons">
          <button class="primary" id="getStartedBtn" type="submit" form="signup-form">
            Get started
          </button>
          <p>Do you already have an account?</p>
          <a href="login.html">
            <button class="secondary">Sign in</button>
          </a>
        </div>
      </div>
    </div>

    <!-- Generic Notification Modal -->
    <div id="notificationModal" class="modal">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2 id="modalTitle"></h2>
        <p id="modalMessage"></p>
      </div>
    </div>
    
    <script type="module" src="register2.js"></script>
  </body>
</html>
